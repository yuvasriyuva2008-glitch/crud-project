<!DOCTYPE html>
<html>
<head>
    <title>Student Form</title>
</head>
<body>
    <h1>
        {% if student %}
            Update Student
        {% else %}
            Add Student
        {% endif %}
    </h1>

    <form method="POST">
        {% csrf_token %}

        <label>Name:</label>
        <input type="text" name="name"
               value="{{ student.name|default:'' }}" required>
        <br><br>

        <label>Email:</label>
        <input type="email" name="email"
               value="{{ student.email|default:'' }}" required>
        <br><br>

        <label>Department:</label>
        <input type="text" name="department"
               value="{{ student.department|default:'' }}" required>
        <br><br>

        <button type="submit">Save Student</button>
    </form>

    <br>
    <a href="{% url 'student_list' %}">Back to List</a>
</body>
</html>
